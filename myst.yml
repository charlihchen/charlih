version: 1
project:
  title: Charlih Chen personal website
  authors:
    - name: "Charlih Chen"
      email: "charlih_chen@hotmail.com"
      affiliations: "IT Helpdesk, Fortinet"
  copyright: "©2026 Charlih Chen"
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - generate_rss.py
    - inject_comments.py
    - rss.xml
    - atom.xml
    - CONDUCT.md
    - CONTRIBUTING.md
    - README.md
  github: charlihchen/charlih
  thebe:
    binder:
      repo: opengeos/myst-website-template
      provider: github
      url: https://mybinder.org
      ref: main
  bibliography:
    - pages/references.bib
  toc:
    - file: index.md
    - title: Preface
      children:
        - file: pages/preface.md
    - title: Getting Started
      children:
        - file: pages/part01/getting-started.md
        - file: pages/part01/installation.md
    - title: Examples
      children:
        - file: pages/part02/first-example.md
    - title: DIY
      children:
        - file: pages/diy.md
      children:
        - file: pages/diy/ktv.md    
    - title: Dog
      children:
        - file: pages/dog.md
    - file: blog.md
    - title: Blog
      children:
        - file: tags/myst-markdown.md
        - file: tags/tutorial.md
        - file: tags/github-pages.md
    - pattern: posts/*.md
      hidden: true
site:
  nav:
    - title: Internal blog page
      url: /blog
  options:
    logo: logo.png
    logo_dark: logo.png
    favicon: fav.ico
    folders: true
    style: custom.css    
    # analytics_google: G-XXX
    # hide_toc: true
  actions:
    - title: RSS
      url: https://opengeos.org/myst-website-template/rss.xml
  template: book-theme
  parts:
    primary_sidebar_footer: ''
    banner: Updates will be released soon!
    # footer: footer.md
    footer: Charlih Chen (c) 2026
    # style: ./css/footer.css
